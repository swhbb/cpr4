<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cpr4 — The Cooper Family</title>
<meta name="description" content="The Cooper family emblem — Brian, Sue, Ben and Rob Cooper. cpr4.com">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    height: 100%;
    background: #f6efe2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
  }
  .wrap {
    width: 100%;
    max-width: 800px;
    padding: 24px;
    box-sizing: border-box;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;

<body>
<div class="wrap">

<defs>

<!-- outer roundel ring -->

<path transform="translate(430 88)" d="M0 -14 L3.29 -4.53 L13.32 -4.33 L5.32 1.73 L8.23 11.33 L0 5.6 L-8.23 11.33 L-5.32 1.73 L-13.32 -4.33 L-3.29 -4.53 Z"/>
<path transform="translate(490 88)" d="M0 -14 L3.29 -4.53 L13.32 -4.33 L5.32 1.73 L8.23 11.33 L0 5.6 L-8.23 11.33 L-5.32 1.73 L-13.32 -4.33 L-3.29 -4.53 Z"/>

<!-- shield -->
<path d="M170 140 H630 V430 C630 560 520 650 400 700 C280 650 170 560 170 430 Z" fill="#14303a"/>
<path d="M170 140 H630 V430 C630 560 520 650 400 700 C280 650 170 560 170 430 Z" fill="none" stroke="#b87333" stroke-width="6"/>

<path d="M325 290 C290 350 290 450 325 510 L475 510 C510 450 510 350 475 290 Z" fill="url(#copper)"/>

<g stroke="#5c3010" stroke-width="2" opacity="0.55">
<path d="M400 290 V510"/>
<path d="M362 290 C338 370 338 430 362 510"/>
<path d="M438 290 C462 370 462 430 438 510"/>
<path d="M330 290 C300 370 300 430 330 510"/>
<path d="M470 290 C500 370 500 430 470 510"/>

<g stroke="#f6efe2" stroke-width="9">
<path d="M280 322 Q400 342 520 322"/>
<path d="M280 372 Q400 392 520 372"/>
<path d="M280 428 Q400 448 520 428"/>
<path d="M280 478 Q400 498 520 478"/>
</g>
</g>
<ellipse cx="400" cy="290" rx="75" ry="13" fill="#e9c9a0"/>
<ellipse cx="400" cy="290" rx="60" ry="9" fill="#7a3f15"/>

<!-- shield lettering -->
<text x="407" y="238" text-anchor="middle" font-family="Jost, sans-serif" font-weight="500" font-size="30" letter-spacing="14" fill="#e9c9a0">COOPER</text>
<text x="400" y="610" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="800" font-size="60" fill="#e9c9a0">4</text>

<!-- wordmark -->
<text x="400" y="812" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="800" font-size="104" fill="#14303a">cpr<tspan fill="#b87333">4</tspan></text>
<text x="400" y="858" text-anchor="middle" font-family="Jost, sans-serif" font-weight="500" font-size="17" letter-spacing="6" fill="#14303a">FOUR COOPERS · BOUND TOGETHER</text>
<text x="400" y="910" text-anchor="middle" font-family="Jost, sans-serif" font-weight="400" font-size="22" letter-spacing="3" fill="#8f4f1f">cpr4.com</text>
